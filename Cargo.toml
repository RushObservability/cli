[package]
name = "rush-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Live terminal tail and search for Rush logs and APM"
repository = "https://github.com/RushObservability/cli"

[[bin]]
name = "rush"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.2"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
futures-util = "0.3"
open = "5.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
url = "2.5"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
httpmock = "0.7"
predicates = "3.1"
tempfile = "3.19"

[profile.release]
lto = "thin"
strip = true
