[graph]
# Matches the four targets release.yml ships.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
    # All three are "unsound" advisories, not vulnerabilities, and all are
    # transitive. Revisit when the upstream crates bump; none is actionable here.
    { id = "RUSTSEC-2026-0221", reason = "event-listener. Dev-only: reaches us solely through httpmock, so it is never in a shipped binary (0 occurrences in `cargo tree --edges normal`)." },
    { id = "RUSTSEC-2026-0002", reason = "lru IterMut stacked-borrows. Pulled in by ratatui 0.29; needs lru >=0.16.3, which requires ratatui to bump. Not reachable from our code -- we never touch ratatui's internal layout cache directly." },
    { id = "RUSTSEC-2026-0253", reason = "lru LruCache::pop use-after-free. Same ratatui 0.29 -> lru 0.12.5 path; needs lru >=0.18.2. Requires catch_unwind plus a panicking Drop on the key type to trigger; ratatui keys its layout cache with plain value types." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    # option-ext (via directories -> dirs-sys), used for config-directory
    # resolution. MPL-2.0 is file-level copyleft: obligations attach only if we
    # modify option-ext's own sources, which we do not. Linking is unencumbered.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
